name: Blue/Green Deployment and Testing

on:
  push:
    branches: [ blue ]
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Instalar dependencias (si existen)
        run: npm install || echo "No hay dependencias que instalar"

      - name: 🚀 Construir el sitio (si es necesario)
        run: echo "No hay build en este caso, pero aquí se colocaría"

      - name: 🖼️ Subir archivos al ambiente de pruebas
        uses: actions/upload-pages-artifact@v2
        with:
          path: "."

      - name: 📝 Ejecutar pruebas automatizadas
        run: |
          curl -Is https://bfabio0812.github.io/servidor-web-github/ | head -n 1
          grep "HTTP/2 200" || exit 1

      - name: ✅ Notificar que las pruebas fueron exitosas
        if: success()
        run: echo "La versión Blue pasó las pruebas."

      - name: 🚀 Promover Blue a Green (Simulación)
        if: success()
        run: |
          echo "Promoviendo la versión Blue a producción."
          git checkout green
          git merge blue -m "Promoviendo versión Blue a producción"
          git push origin green

      - name: 🔄 Rollback a Green (si las pruebas fallan)
        if: failure()
        run: |
          echo "Las pruebas fallaron. Volviendo a la versión Green."
          git checkout blue
          git reset --hard green
          git push origin blue --force

      - name: 🏁 Notificación final
        run: echo "Despliegue y pruebas completadas."